<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memories</title>

    <style>
        :root {
            --near-black: #0a0a0a;
            --charcoal: #111111;
            --dark-grey: #1a1a1a;
            --mid-grey: #2a2a2a;
            --light-grey: #8a8a8a;
            --text-primary: #f5f5f5;
            --text-secondary: #b3b3b3;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-strong: rgba(255, 255, 255, 0.12);
            --label-bg: rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 255, 255, 0.05),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(255, 255, 255, 0.035),
                    transparent 30%
                ),
                var(--near-black);
            color: var(--text-primary);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 20px;
        }

        /* ===== Header ===== */

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 0 16px;
        }

        .header h1 {
            font-size: clamp(2.4rem, 5vw, 3.2rem);
            font-weight: 300;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .header p {
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            margin-top: 10px;
        }

        /* ===== Gallery ===== */

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 1100px;
        }

        /* ===== Memory Card ===== */

        .memory-card {
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow:
                0 6px 28px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            aspect-ratio: 4 / 3;
            transition: box-shadow 0.3s ease;
        }

        .memory-card:hover {
            box-shadow:
                0 10px 36px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .memory-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .memory-card:hover img {
            transform: scale(1.03);
        }

        /* ===== Image Labels ===== */

        .memory-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            padding: 5px 12px;
            background: var(--label-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border-strong);
            border-radius: 5px;
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            font-variant: small-caps;
        }

        /* ===== Footer ===== */

        .footer {
            text-align: center;
            margin-top: 24px;
            padding: 12px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        /* ===== Responsive ===== */

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>

</head>

<body>

    <!-- Header -->

    <header class="header">
        <h1>Memories</h1>
        <p>A collection of moments worth remembering.</p>
    </header>

    <!-- Gallery -->

    <section class="gallery">

        <div class="memory-card">
            <img src="WhatsApp%20Image%202026-08-19%20at%208.33.30%20PM.jpeg" alt="Memory">
            <span class="memory-label">Random Moments</span>
        </div>

        <div class="memory-card">
            <img src="WhatsApp%20Image%202026-08-19%20at%208.33.30%20PM%20(1).jpeg" alt="Memory">
        </div>

        <div class="memory-card">
            <img src="WhatsApp%20Image%202026-08-19%20at%208.33.31%20PM.jpeg" alt="Memory">
            <span class="memory-label">Summer</span>
        </div>

        <div class="memory-card">
            <img src="WhatsApp%20Image%202026-08-19%20at%208.33.32%20PM.jpeg" alt="Memory">
        </div>

        <div class="memory-card">
            <img src="WhatsApp%20Image%202026-08-19%20at%208.34.54%20PM.jpeg" alt="Memory">
            <span class="memory-label">Good Times</span>
        </div>

    </section>

    <!-- Footer -->

    <footer class="footer">
        Made of moments.
    </footer>

</body>
</html>
